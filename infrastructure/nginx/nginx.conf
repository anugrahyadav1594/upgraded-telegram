# =====================================================================================
# Edge proxy — the single origin the browser talks to.
#
# One origin is not a style choice: the session cookie is HttpOnly + SameSite, and the WebSocket
# handshake authenticates with that same cookie. Serving the SPA and the API from two origins would
# mean a cross-site cookie, a CORS allow-list, and a class of bugs that only show up in production.
#
# Mounted at /etc/nginx/conf.d/default.conf by infrastructure/docker-compose.yml.
# =====================================================================================

upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

upstream frontend_upstream {
    server frontend:80;
}

# Rate limiting at the edge as well as in the application: the app's limiter protects business rules
# (login attempts, message throughput); this one protects the process from raw connection floods.
limit_req_zone $binary_remote_addr zone=api_zone:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=5r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;

    # Request bodies are capped below the application limit (attachments are not supported yet).
    client_max_body_size 1m;
    server_tokens off;

    # ---------------------------------------------------------------------------------
    # Security headers. `script-src 'self'` with no inline exception: the pre-paint theme bootstrap is
    # an external file (frontend/public/theme-init.js) precisely so no hash has to be maintained here.
    # `style-src 'unsafe-inline'` is required by React's inline style attributes for avatar colours.
    # ---------------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' ws: wss:; font-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # ---------------------------------------------------------------------------------
    # Liveness for the compose health check and any external probe.
    # ---------------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---------------------------------------------------------------------------------
    # API.
    # ---------------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_zone burst=60 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Login/register/password-reset get a stricter bucket: these are the endpoints a credential-stuffing
    # script hammers, and the application's own limiter works per account/IP, not per connection.
    location ~ ^/api/v1/auth/(login|register|forgot-password|reset-password)$ {
        limit_req zone=auth_zone burst=10 nodelay;
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---------------------------------------------------------------------------------
    # WebSocket (STOMP over SockJS/raw). Upgrade headers are required; the long read timeout keeps
    # an idle socket alive (the client heartbeats every 10s, so 60s is generous but not infinite).
    # ---------------------------------------------------------------------------------
    location /ws {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---------------------------------------------------------------------------------
    # OpenAPI documentation and actuator health (read-only endpoints; no secrets exposed).
    # ---------------------------------------------------------------------------------
    location ~ ^/(v3/api-docs|swagger-ui) {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
    }

    location /actuator/health {
        proxy_pass http://backend_upstream;
        access_log off;
    }

    # ---------------------------------------------------------------------------------
    # The SPA. Everything else falls through to the static build.
    # ---------------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
    }
}
