# Apache Maven Wrapper — the "only-script" distribution: no jar is committed, the script downloads
# the Maven distribution below on first use. That keeps a binary blob out of the repository while
# still pinning the exact Maven version every developer and CI runner uses.
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.9/apache-maven-3.9.9-bin.zip
distributionType=only-script
wrapperVersion=3.3.2
